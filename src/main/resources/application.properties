spring.application.name=donor

# conexiunea MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/donor_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# configurare Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# portul serverului
server.port=8080

# Numele fi?ierului unde se vor scrie toate logurile aplica?iei
logging.file.name=donor_app.log
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=30MB